# Mise à jour quotidienne des flux RSS OHdio.
# Chaque jour vers 15 h (heure de Toronto), régénère les 6 flux et publie
# les fichiers modifiés. Le flux d'archives 2017-2020 est figé : il n'est
# jamais touché ici. Les pages GitHub se redéploient automatiquement à
# chaque publication.
name: Mise à jour quotidienne des flux

on:
  schedule:
    - cron: '0 20 * * *'  # 20 h UTC = 15 h HNE / 16 h HAE
  workflow_dispatch:  # permet aussi de lancer la mise à jour à la main

permissions:
  contents: write

concurrency:
  group: mise-a-jour-flux
  cancel-in-progress: false

jobs:
  mettre-a-jour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Régénérer les flux
        run: python3 rcrss.py --liste emissions.txt --sortie . --max-episodes 2000 --max-pages 40
      - name: Publier les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xml cache.json
          git diff --cached --quiet || git commit -m "Mise à jour quotidienne des flux"
          git push
